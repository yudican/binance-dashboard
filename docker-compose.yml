services:
  future-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: future-dashboard:latest
    container_name: future-dashboard
    restart: unless-stopped
    ports:
      - "3014:3014"
    environment:
      - NODE_ENV=production
      - PORT=3014
      - HOSTNAME=0.0.0.0
      # Optional single-user mode — uncomment to sign server-side without
      # passing keys from the browser:
      # - BINANCE_API_KEY=${BINANCE_API_KEY}
      # - BINANCE_API_SECRET=${BINANCE_API_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3014/api/whoami"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
